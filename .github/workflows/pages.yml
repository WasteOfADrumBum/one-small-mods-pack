name: Website (GitHub Pages)

# Manually started only. `build` always runs: it generates the site from the candidate commit and
# runs the real-browser accessibility automation. `deploy` runs only when mode is deploy, the
# owner started it with the exact authorization phrase, and the manual accessibility acceptance
# record at the candidate has an owner sign-off and no PENDING or FAIL rows.
#
# One-time setup by the owner: Settings > Pages > Source: GitHub Actions; and add the owner as a
# required reviewer on the `github-pages` environment.

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA to build the site from (must be on main)
        required: true
        type: string
      mode:
        description: build verifies and uploads the site artifact only; deploy publishes it
        required: true
        default: build
        type: choice
        options: [build, deploy]
      authorization:
        description: 'For deploy, type exactly: I authorize deploying the ModsPack website from <candidate_sha>'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Candidate is on main
        env:
          SHA: ${{ inputs.candidate_sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::candidate_sha must be a full SHA"; exit 1; }
          test "$(git rev-parse HEAD)" = "$SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on main"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --global playwright@1
      - run: npx playwright install --with-deps chromium
      # Builds with relative links, so the site works at https://<owner>.github.io/<repo>/.
      - run: npm run site:check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    if: inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Owner authorization
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          GIVEN: ${{ inputs.authorization }}
          WANT: I authorize deploying the ModsPack website from ${{ inputs.candidate_sha }}
        run: |
          test "$ACTOR" = "$OWNER" || { echo "::error::only the repository owner may deploy"; exit 1; }
          test "$GIVEN" = "$WANT" || { echo "::error::authorization phrase does not match exactly"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
      - name: Manual accessibility acceptance is recorded at the candidate
        run: |
          f=release/2.0.0/manual-acceptance.md
          test -f "$f" || { echo "::error::$f missing"; exit 1; }
          if grep -nE '\|\s*(PENDING|FAIL)\s*\|' "$f"; then echo "::error::manual acceptance has PENDING or FAIL rows"; exit 1; fi
          grep -Eq '^Owner sign-off: [^<_].+ on [0-9]{4}-[0-9]{2}-[0-9]{2}' "$f" || { echo "::error::no owner sign-off line in $f"; exit 1; }
      - id: deployment
        uses: actions/deploy-pages@v4
