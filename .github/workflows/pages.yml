name: Website (build check)

# Manually started only. Generates the site from the candidate commit and runs the real-browser
# accessibility automation. The site is hosted on Vercel (vercel.json), which deploys main on
# every merge; this workflow is the browser check, not a deploy.

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA to build the site from (must be on main)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
      - name: Candidate is on main
        env:
          SHA: ${{ inputs.candidate_sha }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::candidate_sha must be a full SHA"; exit 1; }
          test "$(git rev-parse HEAD)" = "$SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on main"; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --global playwright@1
      - run: npx playwright install --with-deps chromium
      # Builds with relative links, so the site works at https://<owner>.github.io/<repo>/.
      - run: npm run site:check

